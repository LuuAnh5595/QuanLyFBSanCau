name = "quan-ly-fb-san-cau"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "fb-san-cau-db"
database_id = "fb-san-cau-db-id"

# Cloudflare R2 Storage binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fb-san-cau-media"

# Scheduled Cron Triggers (Khung giờ vàng Việt Nam UTC+7: 8h30 sáng, 14h30 chiều, 18h30 tối)
# UTC times: 01:30, 07:30, 11:30
[triggers]
crons = ["30 1 * * *", "30 7 * * *", "30 11 * * *"]

# Biến môi trường mặc định (Các key nhạy cảm nên đặt qua wrangler secret)
[vars]
ENVIRONMENT = "production"
DEFAULT_TONE = "năng động, hào hứng, thân thiện"
ADMIN_PASSWORD = "admin"
TELEGRAM_WEBHOOK_SECRET = "telegram_secret_token_123"
R2_PUBLIC_DOMAIN = ""
